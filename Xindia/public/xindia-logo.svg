<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none" width="100%" height="100%">
  <!-- Stylized Geometric Orange X Mark -->
  <g transform="translate(10, 10)">
    <!-- Diagonal stroke 1: top-left to bottom-right -->
    <path d="M12 14 L32 14 L68 66 L48 66 Z" fill="#FF6600" />
    <!-- Diagonal stroke 2: top-right to bottom-left with angular cut -->
    <path d="M48 14 L68 14 L32 66 L12 66 Z" fill="#E8581C" />
    <!-- Dynamic Accent Core -->
    <polygon points="34,36 46,36 40,44" fill="#FF8533" opacity="0.9" />
  </g>

  <!-- Typography: INDIA -->
  <text x="95" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="3" fill="#0F172A">
    <tspan fill="#FF6600">X</tspan>INDIA
  </text>
  
  <!-- Subtitle Tagline -->
  <text x="98" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="3.5" fill="#64748B">
    BUSINESS LAUNCHPAD
  </text>
</svg>
